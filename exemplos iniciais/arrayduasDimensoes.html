<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculo media com arrays</title>
</head>
<body>
    
    <script>
        
        const alunos = ["joao", "juliana", "caio", "ana"];
        const medias = [10, 8, 7.5, 9];
                        // 0      1
        const listas = [alunos, medias];

        alert(`O aluno da posição 3 é:${listas [0][3]}`)

        alert(`A média desse aluno é: ${listas [1] [2]}`)



    </script>

</body>
