<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch</title>
</head>
<body>
    
    <script>
        const dataDeHoje = new Date()
        switch(dataDeHoje.getDay()){
            case 0: 
            alert("domingo")
            break
            case 2: 
            alert("dia da semana Segunda")
            break
            case 3: 
            alert("dia da semana terça")
            break
            default:
            alert("opção invalida")
        }








    </script>

</body>
</html>
